[package]
name = "rust_captcha"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.3.0"
serde = { version = "1", features = ["derive"] }
lemmy_api_common = { git = "https://github.com/LemmyNet/lemmy.git", branch = "captcha-plugin" }
captcha = "1.0.0"
getrandom = "0.3.4"
hound = "3.5.1"
uuid = { version = "1.20.0", features = ["v4", "rng-getrandom"] }
anyhow = "1.0.100"
base64 = "0.22.1"
